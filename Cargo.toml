[package]
name = "vdfs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.3.5", features = ["derive"] }
glob = "0.3.1"
nom = "7.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml =  "0.9"
yore = "1.1.0"
walkdir = "2.4.0"
memmap2 = "0.9"
tree-ds = { version = "0.1.6", features = ["auto_id"] }
indicatif = "0.17.8"
